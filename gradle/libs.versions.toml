[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# Static analyzer (report-only for now). 1.23.8 is the latest STABLE line; 2.x is still alpha.
# It is built against Kotlin 2.0.21 (same as this project) and AGP 8.8.1 (compatible with 8.7.3).
# https://detekt.dev/docs/1.23.8/introduction/compatibility/
detekt = "1.23.8"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
securityCrypto = "1.1.0"
fragment = "1.8.5"
# Per-app language preferences (Android 12 / API 32 and lower backward compatibility for
# AppCompatDelegate.setApplicationLocales; on API 33+ it delegates to the framework LocaleManager).
# AppCompat 1.6.0+ is required for the backward-compatible locale APIs; 1.6.1 is exactly the version
# com.google.android.material:material:1.12.0 already pulls transitively, so the resolved graph is
# unchanged and the artifact is already present offline.
# https://developer.android.com/guide/topics/resources/app-languages
appcompat = "1.6.1"
markwon = "4.6.2"
coreKtx = "1.15.0"
material = "1.12.0"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.5"
lifecycle = "2.8.7"
work = "2.10.0"
mlkitText = "16.0.1"
# ML Kit object detection & tracking, BUNDLED variant (`com.google.mlkit`, not `.gms`): the coarse
# classifier model ships in the APK, so detection works offline right after install with no Google
# Play services model download. The installation-paths table lists object detection as bundled-only.
# https://developers.google.com/ml-kit/vision/object-detection/android
# https://developers.google.com/ml-kit/tips/installation-paths
mlkitObjectDetection = "17.0.2"
# ML Kit subject segmentation, UNBUNDLED-only (`com.google.android.gms`): the model is downloaded by
# Google Play services at runtime (~200 KB app-size impact). Beta API, no SLA; it needs Play services
# and a one-time model download, which `image_remove_background` reports honestly on failure.
# https://developers.google.com/ml-kit/vision/subject-segmentation/android
# https://developers.google.com/ml-kit/tips/installation-paths
mlkitSubjectSegmentation = "16.0.0-beta1"
# AndroidSVG: pure-Java static SVG parser/renderer (no native `.so`, so no 16 KB page concern).
# Renders static SVG to a Bitmap/Picture; unsupported features (filters, some CSS) are ignored.
# https://github.com/BigBadaboom/androidsvg (artefact `com.caverock:androidsvg-aar`)
androidsvg = "1.4"
playServicesLocation = "21.3.0"
exifinterface = "1.3.7"
documentfile = "1.0.1"
commonsCompress = "1.27.1"
# XZ for Java: the runtime XZ/LZMA codec that commons-compress 1.27.1 declares as an OPTIONAL
# dependency (7z and .xz need org.tukaani.xz at runtime). Without it both files_7z_create and
# files_7z_extract fail with NoClassDefFoundError. 1.10 is exactly the version pinned in the
# commons-compress 1.27.1 POM, so the API surface matches.
# https://repo1.maven.org/maven2/org/apache/commons/commons-compress/1.27.1/commons-compress-1.27.1.pom
# https://mvnrepository.com/artifact/org.tukaani/xz
xz = "1.10"
# Maintained fork of JSch (pure-Java SSH2: exec channel + SFTP). update.md §5.1.
# https://github.com/mwiede/jsch
jsch = "0.2.20"
junrar = "7.5.5"
pdfboxAndroid = "2.0.27.0"
rtfparserkit = "1.16.0"
commonsCsv = "1.14.1"
# Home-screen widget (update.md idea #10). Glance 1.1.1 is the stable release built against the
# Compose 1.7 line (our Compose BOM 2024.10.01). Glance 1.2+ requires a newer compileSdk.
# https://developer.android.com/develop/ui/compose/glance/create-app-widget
glanceAppwidget = "1.1.1"
# SQLCipher for Android (update.md idea #7): full-database encryption at rest, wired into Room via
# SupportOpenHelperFactory. Pinned to 4.13.0 on purpose: 4.14.0+ pulls androidx.sqlite 2.6.2 and
# kotlin-stdlib 2.2.10, which fight our Kotlin 2.0.21 / androidx.sqlite 2.4.0 line; 4.13.0 depends
# only on androidx.sqlite 2.2.0 (resolved up to Room's 2.4.0) and has arm64-v8a native libs.
# https://github.com/sqlcipher/sqlcipher-android
sqlcipher = "4.13.0"
# Offline OCR with Cyrillic support (ML Kit has no Cyrillic model). Apache-2.0, JitPack-only.
# Bundled traineddata (tessdata_fast) lives in app/src/main/assets/tessdata.
# https://github.com/adaptech-cz/Tesseract4Android
tesseract4android = "4.9.0"
# On-device embedding engine (ONNX Runtime Mobile). Bundles libonnxruntime.so for arm64-v8a
# (ABI-filtered) and runs the bundled int8 `rubert-tiny-turbo` model fully offline. MIT-licensed.
# 1.23.1 is the chosen pin: `libonnxruntime.so` AND `libonnxruntime4j_jni.so` both have 16 KB
# PT_LOAD alignment (verified with an ELF program-header read), unlike 1.20.0 whose JNI lib was 4 KB.
# https://onnxruntime.ai/docs/build/custom.html
onnxruntimeAndroid = "1.23.1"
# ffmpeg-kit, community-maintained fork (LGPL v3, no GPL). Upstream `com.arthenica:ffmpeg-kit-full`
# was retired in 2025 and its AARs removed from Maven Central; this fork keeps the SAME package and
# API (`com.arthenica.ffmpegkit.FFmpegKit`) — only the groupId changes. Verified 2026-10-13: the AAR
# resolves from Central, and every bundled arm64-v8a `.so` has PT_LOAD `align 2**14` (16 KB), which
# the app requires (SPEC.md §18). Used by the audio/video editing tools.
# https://github.com/ffmpegkit-maintained/ffmpeg
ffmpegKitMaintained = "8.1.9"

